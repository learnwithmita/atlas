<svg viewBox="0 0 1000 1414" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1d2430" flood-opacity="0.08"/>
    </filter>
    <style>
      .ink{fill:#1d2430}.ink2{fill:#5e6673}.white{fill:#ffffff}
      .h{font-weight:800}.b{font-weight:700}.m{font-weight:500}
      .card{fill:#ffffff;stroke:#e7e7ee;stroke-width:1.2;filter:url(#soft)}
      .sect{font-size:21px;font-weight:800;fill:#1d2430}
      .body{font-size:17px;font-weight:500;fill:#1d2430}
      .sub{font-size:14.5px;font-weight:600;fill:#5e6673;letter-spacing:1.2px}
      .kw{font-size:17px;font-weight:700;fill:#1d2430}
    </style>
  </defs>

  <rect width="1000" height="1414" fill="#f7f7fb"/>

  <!-- Header -->
  <text x="40" y="74" class="h" font-size="46" fill="#1d2430">Respiration in Humans</text>
  <g>
    <rect x="40" y="92" width="232" height="30" rx="15" fill="#eeeefb"/>
    <text x="56" y="113" font-size="14" font-weight="700" fill="#5b5bd6" letter-spacing="1.5">BIOLOGY · AT A GLANCE</text>
  </g>
  <text x="960" y="78" text-anchor="end" font-size="15" font-weight="600" fill="#5e6673">SEAB K325 · recall sheet</text>

  <!-- ============ Card A: Gaseous exchange at the alveolus ============ -->
  <rect x="40" y="150" width="920" height="352" rx="20" class="card"/>
  <rect x="40" y="150" width="6" height="352" rx="3" fill="#5b5bd6"/>
  <text x="70" y="190" class="sect">Gaseous exchange — the alveolus</text>

  <!-- diagram -->
  <g transform="translate(70,210)">
    <!-- capillary behind -->
    <path d="M10,150 Q200,60 390,150" fill="none" stroke="#f3cfca" stroke-width="46" stroke-linecap="round"/>
    <path d="M10,150 Q200,60 390,150" fill="none" stroke="#d98b7f" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <!-- red blood cells -->
    <g fill="#d0514a">
      <ellipse cx="70" cy="128" rx="15" ry="10"/><ellipse cx="150" cy="104" rx="15" ry="10"/>
      <ellipse cx="240" cy="100" rx="15" ry="10"/><ellipse cx="330" cy="126" rx="15" ry="10"/>
    </g>
    <!-- alveolus sac -->
    <circle cx="200" cy="150" r="92" fill="#fbe7e3" stroke="#e7a99f" stroke-width="2.5"/>
    <circle cx="200" cy="150" r="78" fill="#fdf3f1" stroke="#f0cfc8" stroke-width="6" opacity="0.9"/>
    <text x="200" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#b06a5e">air</text>
    <text x="200" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#b06a5e">sac</text>
    <!-- diffusion arrows -->
    <g stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M250,120 L300,96" stroke="#5b5bd6" marker-end="url(#ah)"/>
      <path d="M300,150 L250,174" stroke="#8a93a3" marker-end="url(#ah2)"/>
    </g>
    <text x="312" y="92" font-size="16" font-weight="800" fill="#5b5bd6">O₂</text>
    <text x="236" y="196" font-size="16" font-weight="800" fill="#6b7280">CO₂</text>
    <!-- labels -->
    <text x="12" y="250" class="ink2" font-size="13.5" font-weight="600">wall + capillary = one cell thick · moist lining · many capillaries</text>
  </g>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5b5bd6"/></marker>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a93a3"/></marker>
  </defs>

  <!-- adaptations -->
  <g transform="translate(520,222)">
    <text x="0" y="0" class="sub">WHY IT WORKS (feature → function)</text>
    <g font-size="17">
      <g transform="translate(0,34)"><circle cx="7" cy="-5" r="5" fill="#5b5bd6"/><text x="26" y="0" class="ink"><tspan class="b">Large surface area</tspan> → more diffusion</text></g>
      <g transform="translate(0,74)"><circle cx="7" cy="-5" r="5" fill="#5b5bd6"/><text x="26" y="0" class="ink"><tspan class="b">Wall one cell thick</tspan> → short diffusion</text><text x="26" y="24" class="ink">distance</text></g>
      <g transform="translate(0,134)"><circle cx="7" cy="-5" r="5" fill="#5b5bd6"/><text x="26" y="0" class="ink"><tspan class="b">Moist lining</tspan> → gases dissolve first</text></g>
      <g transform="translate(0,174)"><circle cx="7" cy="-5" r="5" fill="#5b5bd6"/><text x="26" y="0" class="ink"><tspan class="b">Dense capillaries</tspan> → keep a steep</text><text x="26" y="24" class="ink"><tspan class="b">concentration gradient</tspan></text></g>
    </g>
  </g>

  <!-- ============ Card B: Breathing ============ -->
  <rect x="40" y="520" width="920" height="214" rx="20" class="card"/>
  <rect x="40" y="520" width="6" height="214" rx="3" fill="#5b5bd6"/>
  <text x="70" y="560" class="sect">Breathing (ventilation)</text>
  <!-- inspiration -->
  <g transform="translate(70,584)">
    <rect x="0" y="0" width="420" height="124" rx="14" fill="#f3f8f4" stroke="#d6e8dc" stroke-width="1.2"/>
    <text x="18" y="30" font-size="15" font-weight="800" fill="#2e7d5b">INSPIRATION — breathe in</text>
    <text x="18" y="58" class="body" font-size="15.5">external intercostals <tspan class="b">contract</tspan> · ribs <tspan class="b">up &amp; out</tspan></text>
    <text x="18" y="82" class="body" font-size="15.5">diaphragm <tspan class="b">contracts &amp; flattens</tspan></text>
    <text x="18" y="106" class="body" font-size="15.5">volume <tspan class="b">↑</tspan> · pressure <tspan class="b">↓</tspan> (below atmospheric) → air in</text>
  </g>
  <!-- expiration -->
  <g transform="translate(510,584)">
    <rect x="0" y="0" width="420" height="124" rx="14" fill="#fbf4f2" stroke="#efd8d0" stroke-width="1.2"/>
    <text x="18" y="30" font-size="15" font-weight="800" fill="#b5503a">EXPIRATION — breathe out</text>
    <text x="18" y="58" class="body" font-size="15.5">internal intercostals <tspan class="b">contract</tspan> · ribs <tspan class="b">down &amp; in</tspan></text>
    <text x="18" y="82" class="body" font-size="15.5">diaphragm <tspan class="b">relaxes &amp; domes up</tspan></text>
    <text x="18" y="106" class="body" font-size="15.5">volume <tspan class="b">↓</tspan> · pressure <tspan class="b">↑</tspan> (above atmospheric) → air out</text>
  </g>

  <!-- ============ Card C: Respiration equations ============ -->
  <rect x="40" y="752" width="448" height="238" rx="20" class="card"/>
  <rect x="40" y="752" width="6" height="238" rx="3" fill="#5b5bd6"/>
  <text x="70" y="792" class="sect">Respiration</text>
  <text x="70" y="824" class="sub">AEROBIC · needs oxygen</text>
  <text x="70" y="852" class="body" font-size="16">glucose + oxygen →</text>
  <text x="70" y="876" class="body" font-size="16">carbon dioxide + water (+ energy)</text>
  <g><rect x="70" y="890" width="372" height="30" rx="8" fill="#eeeefb"/>
     <text x="86" y="911" font-size="16" font-weight="700" fill="#3b3b86">C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O</text></g>
  <text x="70" y="950" class="sub">ANAEROBIC · no oxygen (muscle)</text>
  <text x="70" y="976" class="body" font-size="16">glucose → <tspan class="b">lactic acid</tspan> (+ little energy)</text>

  <!-- ============ Card D: Oxygen debt ============ -->
  <rect x="512" y="752" width="448" height="238" rx="20" class="card"/>
  <rect x="512" y="752" width="6" height="238" rx="3" fill="#5b5bd6"/>
  <text x="542" y="792" class="sect">Oxygen debt (hard exercise)</text>
  <g transform="translate(542,816)" font-size="15.5">
    <text x="0" y="22" class="ink"><tspan class="b" fill="#5b5bd6">1.</tspan> muscles need energy fast → <tspan class="b">insufficient O₂</tspan></text>
    <text x="0" y="54" class="ink"><tspan class="b" fill="#5b5bd6">2.</tspan> respire <tspan class="b">anaerobically</tspan> as well as aerobically</text>
    <text x="0" y="86" class="ink"><tspan class="b" fill="#5b5bd6">3.</tspan> <tspan class="b">lactic acid</tspan> builds up → fatigue</text>
    <text x="0" y="118" class="ink"><tspan class="b" fill="#5b5bd6">4.</tspan> <tspan class="b">oxygen debt</tspan> = extra O₂ needed after</text>
    <text x="0" y="150" class="ink"><tspan class="b" fill="#5b5bd6">5.</tspan> breathe <tspan class="b">deep &amp; fast</tspan> to <tspan class="b">oxidise lactic acid</tspan></text>
  </g>

  <!-- ============ Card E: Air pathway ============ -->
  <rect x="40" y="1008" width="920" height="112" rx="20" class="card"/>
  <rect x="40" y="1008" width="6" height="112" rx="3" fill="#5b5bd6"/>
  <text x="70" y="1044" class="sect">Air pathway</text>
  <g transform="translate(70,1066)" font-size="15" font-weight="700" fill="#1d2430">
    <g><rect x="0" y="0" width="92" height="36" rx="10" fill="#eeeefb"/><text x="46" y="24" text-anchor="middle" fill="#3b3b86">larynx</text></g>
    <text x="100" y="24" fill="#9aa0ac">›</text>
    <g><rect x="116" y="0" width="100" height="36" rx="10" fill="#eeeefb"/><text x="166" y="24" text-anchor="middle" fill="#3b3b86">trachea</text></g>
    <text x="224" y="24" fill="#9aa0ac">›</text>
    <g><rect x="240" y="0" width="100" height="36" rx="10" fill="#eeeefb"/><text x="290" y="24" text-anchor="middle" fill="#3b3b86">bronchi</text></g>
    <text x="348" y="24" fill="#9aa0ac">›</text>
    <g><rect x="364" y="0" width="134" height="36" rx="10" fill="#eeeefb"/><text x="431" y="24" text-anchor="middle" fill="#3b3b86">bronchioles</text></g>
    <text x="506" y="24" fill="#9aa0ac">›</text>
    <g><rect x="522" y="0" width="100" height="36" rx="10" fill="#eeeefb"/><text x="572" y="24" text-anchor="middle" fill="#3b3b86">alveoli</text></g>
    <text x="648" y="25" font-size="13.5" font-weight="600" fill="#5e6673">trachea: cartilage rings + cilia sweep mucus</text>
  </g>

  <!-- ============ Card F: Tobacco smoke ============ -->
  <rect x="40" y="1138" width="920" height="240" rx="20" class="card"/>
  <rect x="40" y="1138" width="6" height="240" rx="3" fill="#5b5bd6"/>
  <text x="70" y="1178" class="sect">Tobacco smoke — 3 toxins</text>
  <g transform="translate(70,1200)">
    <!-- nicotine -->
    <rect x="0" y="0" width="286" height="150" rx="14" fill="#faf9ff" stroke="#e7e7f3" stroke-width="1.2"/>
    <text x="18" y="30" font-size="16" font-weight="800" fill="#5b5bd6">Nicotine</text>
    <text x="18" y="60" class="body" font-size="15">addictive</text>
    <text x="18" y="86" class="body" font-size="15">↑ heart rate &amp; blood</text>
    <text x="18" y="108" class="body" font-size="15">pressure</text>
    <text x="18" y="134" class="ink2" font-size="14">→ heart disease risk</text>
    <!-- tar -->
    <rect x="304" y="0" width="286" height="150" rx="14" fill="#faf9ff" stroke="#e7e7f3" stroke-width="1.2"/>
    <text x="322" y="30" font-size="16" font-weight="800" fill="#5b5bd6">Tar</text>
    <text x="322" y="60" class="body" font-size="15"><tspan class="b">carcinogen</tspan> → lung cancer</text>
    <text x="322" y="86" class="body" font-size="15">destroys cilia + ↑ mucus</text>
    <text x="322" y="108" class="body" font-size="15">→ <tspan class="b">chronic bronchitis</tspan></text>
    <text x="322" y="134" class="body" font-size="15">damages alveoli → <tspan class="b">emphysema</tspan></text>
    <!-- CO -->
    <rect x="608" y="0" width="282" height="150" rx="14" fill="#faf9ff" stroke="#e7e7f3" stroke-width="1.2"/>
    <text x="626" y="30" font-size="16" font-weight="800" fill="#5b5bd6">Carbon monoxide</text>
    <text x="626" y="60" class="body" font-size="15">binds haemoglobin</text>
    <text x="626" y="86" class="body" font-size="15"><tspan class="b">irreversibly</tspan> →</text>
    <text x="626" y="108" class="body" font-size="15"><tspan class="b">carboxyhaemoglobin</tspan></text>
    <text x="626" y="134" class="ink2" font-size="14">→ less O₂ carried</text>
  </g>
</svg>
