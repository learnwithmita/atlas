<text x="70" y="180" class="sect">The three processes</text>
<text x="70" y="204" class="sub">HOW SUBSTANCES MOVE IN AND OUT OF CELLS</text>
<g transform="translate(70,224)"><rect x="0" y="0" width="270" height="150" rx="14" fill="#f6f8fc" stroke="#e4e8f1" stroke-width="1.4"/><line x1="135.0" y1="14" x2="135.0" y2="136" stroke="#9aa3b2" stroke-width="2.4" stroke-dasharray="3,7" stroke-linecap="round"/><circle cx="34" cy="38" r="6" fill="#5b5bd6" stroke="#4a4ab8" stroke-width="1.2"/><circle cx="58" cy="74" r="6" fill="#5b5bd6" stroke="#4a4ab8" stroke-width="1.2"/><circle cx="42" cy="110" r="6" fill="#5b5bd6" stroke="#4a4ab8" stroke-width="1.2"/><circle cx="80" cy="50" r="6" fill="#5b5bd6" stroke="#4a4ab8" stroke-width="1.2"/><circle cx="96" cy="100" r="6" fill="#5b5bd6" stroke="#4a4ab8" stroke-width="1.2"/><circle cx="64" cy="124" r="6" fill="#5b5bd6" stroke="#4a4ab8" stroke-width="1.2"/><circle cx="104" cy="30" r="6" fill="#5b5bd6" stroke="#4a4ab8" stroke-width="1.2"/><circle cx="120" cy="118" r="6" fill="#5b5bd6" stroke="#4a4ab8" stroke-width="1.2"/><circle cx="176" cy="58" r="6" fill="#5b5bd6" stroke="#4a4ab8" stroke-width="1.2"/><circle cx="214" cy="100" r="6" fill="#5b5bd6" stroke="#4a4ab8" stroke-width="1.2"/><circle cx="236" cy="44" r="6" fill="#5b5bd6" stroke="#4a4ab8" stroke-width="1.2"/><line x1="96" y1="75.0" x2="186" y2="75.0" stroke="#2e7d5b" stroke-width="5" stroke-linecap="round"/><path d="M186.0,75.0 L177.3,80.0 L177.3,70.0 Z" fill="#2e7d5b"/></g>
<g transform="translate(366,224)"><rect x="0" y="0" width="270" height="150" rx="14" fill="#f6f8fc" stroke="#e4e8f1" stroke-width="1.4"/><line x1="135.0" y1="14" x2="135.0" y2="136" stroke="#9aa3b2" stroke-width="2.4" stroke-dasharray="3,7" stroke-linecap="round"/><circle cx="32" cy="34" r="5" fill="#5aa0e6"/><circle cx="52" cy="64" r="5" fill="#5aa0e6"/><circle cx="36" cy="96" r="5" fill="#5aa0e6"/><circle cx="70" cy="44" r="5" fill="#5aa0e6"/><circle cx="58" cy="118" r="5" fill="#5aa0e6"/><circle cx="92" cy="80" r="5" fill="#5aa0e6"/><circle cx="104" cy="40" r="5" fill="#5aa0e6"/><circle cx="116" cy="108" r="5" fill="#5aa0e6"/><circle cx="44" cy="132" r="5" fill="#5aa0e6"/><circle cx="168" cy="60" r="5" fill="#5aa0e6"/><circle cx="206" cy="110" r="5" fill="#5aa0e6"/><circle cx="150" cy="40" r="9" fill="#e07a86" stroke="#c05c68" stroke-width="1.2"/><circle cx="224" cy="52" r="9" fill="#e07a86" stroke="#c05c68" stroke-width="1.2"/><circle cx="238" cy="96" r="9" fill="#e07a86" stroke="#c05c68" stroke-width="1.2"/><circle cx="196" cy="70" r="9" fill="#e07a86" stroke="#c05c68" stroke-width="1.2"/><circle cx="214" cy="128" r="9" fill="#e07a86" stroke="#c05c68" stroke-width="1.2"/><circle cx="170" cy="112" r="9" fill="#e07a86" stroke="#c05c68" stroke-width="1.2"/><line x1="104" y1="75.0" x2="176" y2="75.0" stroke="#5aa0e6" stroke-width="5" stroke-linecap="round"/><path d="M176.0,75.0 L167.3,80.0 L167.3,70.0 Z" fill="#5aa0e6"/></g>
<g transform="translate(662,224)"><rect x="0" y="0" width="270" height="150" rx="14" fill="#f6f8fc" stroke="#e4e8f1" stroke-width="1.4"/><line x1="135.0" y1="14" x2="135.0" y2="136" stroke="#9aa3b2" stroke-width="2.4" stroke-dasharray="3,7" stroke-linecap="round"/><rect x="119.0" y="54" width="32" height="42" rx="12" fill="#dcdcf7" stroke="#5b5bd6" stroke-width="2"/><circle cx="34" cy="40" r="7" fill="#2fae77" stroke="#1f8f60" stroke-width="1.2"/><circle cx="50" cy="104" r="7" fill="#2fae77" stroke="#1f8f60" stroke-width="1.2"/><circle cx="176" cy="36" r="7" fill="#2fae77" stroke="#1f8f60" stroke-width="1.2"/><circle cx="208" cy="70" r="7" fill="#2fae77" stroke="#1f8f60" stroke-width="1.2"/><circle cx="232" cy="44" r="7" fill="#2fae77" stroke="#1f8f60" stroke-width="1.2"/><circle cx="196" cy="104" r="7" fill="#2fae77" stroke="#1f8f60" stroke-width="1.2"/><circle cx="230" cy="110" r="7" fill="#2fae77" stroke="#1f8f60" stroke-width="1.2"/><circle cx="168" cy="78" r="7" fill="#2fae77" stroke="#1f8f60" stroke-width="1.2"/><line x1="60" y1="75.0" x2="172" y2="75.0" stroke="#d0514a" stroke-width="5" stroke-linecap="round"/><path d="M172.0,75.0 L163.3,80.0 L163.3,70.0 Z" fill="#d0514a"/><circle cx="135.0" cy="40" r="6" fill="#ffd84d"/><line x1="135.0" y1="40" x2="149.0" y2="40.0" stroke="#ffd84d" stroke-width="3.4" stroke-linecap="round"/><line x1="135.0" y1="40" x2="144.89949493661166" y2="49.89949493661166" stroke="#ffd84d" stroke-width="3.4" stroke-linecap="round"/><line x1="135.0" y1="40" x2="135.0" y2="54.0" stroke="#ffd84d" stroke-width="3.4" stroke-linecap="round"/><line x1="135.0" y1="40" x2="125.10050506338834" y2="49.89949493661167" stroke="#ffd84d" stroke-width="3.4" stroke-linecap="round"/><line x1="135.0" y1="40" x2="121.0" y2="40.0" stroke="#ffd84d" stroke-width="3.4" stroke-linecap="round"/><line x1="135.0" y1="40" x2="125.10050506338834" y2="30.100505063388336" stroke="#ffd84d" stroke-width="3.4" stroke-linecap="round"/><line x1="135.0" y1="40" x2="135.0" y2="26.0" stroke="#ffd84d" stroke-width="3.4" stroke-linecap="round"/><line x1="135.0" y1="40" x2="144.89949493661166" y2="30.100505063388333" stroke="#ffd84d" stroke-width="3.4" stroke-linecap="round"/></g>
<text x="70" y="408" font-size="17" font-weight="800" fill="#1d2430">Diffusion</text><text x="70" y="434" font-size="14" fill="#1d2430">Net movement of particles from</text><text x="70" y="454" font-size="14" fill="#1d2430">higher to lower concentration,</text><text x="70" y="474" font-size="14" fill="#1d2430">down a concentration gradient.</text><rect x="70" y="492" width="215" height="26" rx="8" fill="#eeeefb"/><text x="82" y="510" font-size="12.5" font-weight="700" fill="#3b3b86">Down the gradient · No energy</text>
<text x="366" y="408" font-size="17" font-weight="800" fill="#1d2430">Osmosis</text><text x="366" y="434" font-size="14" fill="#1d2430">Net movement of water from a</text><text x="366" y="454" font-size="14" fill="#1d2430">dilute to a concentrated solution</text><text x="366" y="474" font-size="14" fill="#1d2430">through a partially permeable membrane.</text><rect x="366" y="492" width="169" height="26" rx="8" fill="#eeeefb"/><text x="378" y="510" font-size="12.5" font-weight="700" fill="#3b3b86">Water only · No energy</text>
<text x="662" y="408" font-size="17" font-weight="800" fill="#1d2430">Active transport</text><text x="662" y="434" font-size="14" fill="#1d2430">Movement of particles against the</text><text x="662" y="454" font-size="14" fill="#1d2430">gradient, from lower to higher</text><text x="662" y="474" font-size="14" fill="#1d2430">concentration, using energy.</text><rect x="662" y="492" width="248" height="26" rx="8" fill="#eeeefb"/><text x="674" y="510" font-size="12.5" font-weight="700" fill="#3b3b86">Against the gradient · Uses energy</text>

<!-- Card B: osmosis in living cells -->
<rect x="40" y="636" width="920" height="470" rx="20" class="card"/><rect x="40" y="636" width="6" height="470" rx="3" fill="#5b5bd6"/>
<text x="70" y="676" class="sect">Osmosis in living cells</text>
<text x="70" y="700" class="sub">PLANT CELL (HAS A WALL) · NO BURSTING</text>
<g transform="translate(96,718)"><rect x="8" y="8" width="134" height="134" rx="10" fill="#dfe7cf" stroke="#aebb8f" stroke-width="3"/><rect x="16" y="16" width="118" height="118" rx="8" fill="#f6dfe3"/><rect x="22" y="22" width="106" height="106" rx="8" fill="#bfe0ec" stroke="#8fb3c6" stroke-width="2"/></g><text x="171" y="900" text-anchor="middle" font-size="14" font-weight="800" fill="#1d2430">Turgid</text><text x="171" y="919" text-anchor="middle" font-size="12.5" fill="#5e6673">In water: vacuole swells,</text><text x="171" y="937" text-anchor="middle" font-size="12.5" fill="#5e6673">pushes on the wall, firm</text>
<g transform="translate(316,718)"><rect x="8" y="8" width="134" height="134" rx="10" fill="#dfe7cf" stroke="#aebb8f" stroke-width="3"/><rect x="20" y="20" width="110" height="110" rx="8" fill="#f6dfe3"/><rect x="30" y="30" width="90" height="90" rx="10" fill="#cfe4ee" stroke="#9cbccb" stroke-width="2"/></g><text x="391" y="900" text-anchor="middle" font-size="14" font-weight="800" fill="#1d2430">Flaccid</text><text x="391" y="919" text-anchor="middle" font-size="12.5" fill="#5e6673">Loses some water:</text><text x="391" y="937" text-anchor="middle" font-size="12.5" fill="#5e6673">soft and limp</text>
<g transform="translate(536,718)"><rect x="8" y="8" width="134" height="134" rx="10" fill="#dfe7cf" stroke="#aebb8f" stroke-width="3"/><rect x="16" y="16" width="118" height="118" rx="8" fill="#f2eef2"/><ellipse cx="75" cy="75" rx="44" ry="46" fill="#f6dfe3" stroke="#d98f9c" stroke-width="2.5"/><ellipse cx="75" cy="78" rx="30" ry="32" fill="#cfe0e8" stroke="#9cbccb" stroke-width="1.8"/></g><text x="611" y="900" text-anchor="middle" font-size="14" font-weight="800" fill="#1d2430">Plasmolysed</text><text x="611" y="919" text-anchor="middle" font-size="12.5" fill="#5e6673">In concentrated solution:</text><text x="611" y="937" text-anchor="middle" font-size="12.5" fill="#5e6673">membrane pulls from wall</text>
<line x1="740" y1="712" x2="740" y2="1080" stroke="#ececf3" stroke-width="1.4"/>
<text x="770" y="700" class="sub">RED BLOOD CELL (NO WALL)</text>
<g transform="translate(772,724)" transform-origin="0 0"><g transform="scale(0.62)"><circle cx="75" cy="75" r="56" fill="#f4b7bd" stroke="#e08b94" stroke-width="2" stroke-dasharray="5,5"/><circle cx="75" cy="75" r="30" fill="#e8737f"/><circle cx="135" cy="40" r="5" fill="#e8737f"/><circle cx="28" cy="120" r="5" fill="#e8737f"/><circle cx="120" cy="120" r="5" fill="#e8737f"/><circle cx="30" cy="40" r="5" fill="#e8737f"/><circle cx="75" cy="14" r="5" fill="#e8737f"/></g></g><text x="820" y="852" text-anchor="middle" font-size="13" font-weight="800" fill="#1d2430">In water</text><text x="820" y="871" text-anchor="middle" font-size="12" fill="#5e6673">swells &amp; bursts</text>
<g transform="translate(772,878)"><g transform="scale(0.62)"><ellipse cx="75" cy="75" rx="52" ry="52" fill="#e8737f" stroke="#c85b67" stroke-width="2"/><ellipse cx="75" cy="75" rx="22" ry="18" fill="#c85b67"/></g></g><text x="820" y="1006" text-anchor="middle" font-size="13" font-weight="800" fill="#1d2430">Normal</text>
<g transform="translate(878,724)"><g transform="scale(0.62)"><path d="M109,75 L113,97 L92,104 L75,119 L58,104 L37,97 L41,75 L37,53 L58,46 L75,31 L92,46 L113,53 Z" fill="#e8737f" stroke="#c85b67" stroke-width="2"/></g></g><text x="926" y="852" text-anchor="middle" font-size="13" font-weight="800" fill="#1d2430">Concentrated</text><text x="926" y="871" text-anchor="middle" font-size="12" fill="#5e6673">shrinks, crinkled</text>

<!-- Card C: where it matters -->
<rect x="40" y="1126" width="920" height="232" rx="20" class="card"/><rect x="40" y="1126" width="6" height="232" rx="3" fill="#5b5bd6"/>
<text x="70" y="1166" class="sect">Where it matters</text>
<g transform="translate(70,1186)" font-size="14">
 <rect x="0" y="0" width="274" height="140" rx="14" fill="#faf9ff" stroke="#e7e7f3" stroke-width="1.2"/>
 <text x="18" y="30" font-size="15" font-weight="800" fill="#5b5bd6">Diffusion</text>
 <text x="18" y="56" class="ink">Oxygen and carbon dioxide are</text>
 <text x="18" y="74" class="ink">exchanged at the alveoli.</text>
 <text x="18" y="100" class="ink">Digested food is absorbed in</text>
 <text x="18" y="118" class="ink">the small intestine.</text>
 <rect x="292" y="0" width="274" height="140" rx="14" fill="#faf9ff" stroke="#e7e7f3" stroke-width="1.2"/>
 <text x="310" y="30" font-size="15" font-weight="800" fill="#5b5bd6">Osmosis</text>
 <text x="310" y="56" class="ink">Water is absorbed from the soil</text>
 <text x="310" y="74" class="ink">into root hair cells.</text>
 <text x="310" y="100" class="ink">Keeps plant cells turgid to</text>
 <text x="310" y="118" class="ink">support the plant.</text>
 <rect x="584" y="0" width="274" height="140" rx="14" fill="#faf9ff" stroke="#e7e7f3" stroke-width="1.2"/>
 <text x="602" y="30" font-size="15" font-weight="800" fill="#5b5bd6">Active transport</text>
 <text x="602" y="56" class="ink">Mineral ions are absorbed into</text>
 <text x="602" y="74" class="ink">root hair cells.</text>
 <text x="602" y="100" class="ink">Glucose is absorbed in the villi</text>
 <text x="602" y="118" class="ink">of the small intestine.</text>
</g>
</svg>