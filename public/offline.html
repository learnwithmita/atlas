<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Atlas</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        background: #ffffff; color: #1a1a1f; padding: 24px;
      }
      @media (prefers-color-scheme: dark) { body { background: #0e0e12; color: #f2f2f5; } }
      .card { max-width: 360px; text-align: center; }
      .mark { width: 64px; height: 64px; margin: 0 auto 20px; }
      h1 { font-size: 22px; margin: 0 0 8px; font-weight: 650; }
      p { margin: 0 0 20px; color: #6b6b76; line-height: 1.5; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #5b5bd6; color: #fff; font-weight: 600; font-size: 15px;
        padding: 12px 22px; border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="11" stroke="#5b5bd6" stroke-width="2.2" opacity="0.4" />
        <ellipse cx="16" cy="16" rx="11" ry="4.5" stroke="#5b5bd6" stroke-width="2.2" opacity="0.4" transform="rotate(38 16 16)" />
        <circle cx="16" cy="16" r="4.2" fill="#5b5bd6" />
      </svg>
      <h1>You're offline</h1>
      <p>Atlas needs a connection for live tutoring and marking. Reconnect and we'll pick up where you left off.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
